name: Publish film runtime images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish
        required: true
        default: v1
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/publish-images.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: film-comfy
            dockerfile: docker/comfy/Dockerfile
          - image: film-studio-backend
            dockerfile: docker/studio-backend/Dockerfile
          - image: film-studio-frontend
            dockerfile: docker/studio-frontend/Dockerfile
    env:
      TAG: ${{ inputs.tag || 'edge' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.TAG }}
